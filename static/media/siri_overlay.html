<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
    body, html {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background-color: transparent !important; 
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    
    @property --angle {
        syntax: '<angle>';
        initial-value: 0deg;
        inherits: false;
    }
    
    .siri-gradient {
        background: conic-gradient(
            from var(--angle), 
            #ea4326, #ff893d, #ea4326, #3296fa, #2a5298, #ff2a85, #ea4326
        );
        animation: rotateGradient 4s linear infinite;
    }
    
    @keyframes rotateGradient {
        0% { --angle: 0deg; }
        100% { --angle: 360deg; }
    }

    /* Outer glowing squircle border */
    .widget-container {
        position: relative;
        width: 250px;
        height: 250px;
        border-radius: 46px;
        padding: 3px;
        box-sizing: border-box;
    }
    
    /* Inner dark background */
    .widget-inner {
        width: 100%;
        height: 100%;
        background-color: #0b0c10;
        border-radius: 43px;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    .black-hole-container {
        position: relative;
        width: 240px;
        height: 240px;
        animation: float 6s ease-in-out infinite alternate;
    }
    
    @keyframes float {
        0% { transform: translateY(-3px); }
        100% { transform: translateY(3px); }
    }
    
    /* Traveling Shine Effects */
    .shine-back {
        stroke-dasharray: 60 300;
        animation: orbitShine 3s linear infinite;
    }
    .shine-front {
        stroke-dasharray: 60 300;
        animation: orbitShineFront 3s linear infinite;
    }
    .shine-horizon {
        stroke-dasharray: 50 213;
        animation: orbitHorizon 4s linear infinite reverse;
    }
    
    @keyframes orbitShine {
        0% { stroke-dashoffset: 360; }
        100% { stroke-dashoffset: 0; }
    }
    @keyframes orbitShineFront {
        0% { stroke-dashoffset: 360; }
        100% { stroke-dashoffset: 0; }
    }
    @keyframes orbitHorizon {
        0% { stroke-dashoffset: 263; }
        100% { stroke-dashoffset: 0; }
    }

    /* Polished Status Pill Badge */
    .status-badge {
        position: absolute;
        bottom: 18px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45), 
                    inset 0 1px 1px rgba(255, 255, 255, 0.2);
        pointer-events: none;
        user-select: none;
    }

    /* Pulsing Listening Dot */
    .status-dot {
        position: relative;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #3296fa;
        box-shadow: 0 0 8px #3296fa;
    }

    .status-dot::after {
        content: '';
        position: absolute;
        inset: -3px;
        border-radius: 50%;
        background: #3296fa;
        opacity: 0.6;
        animation: pulseWave 1.8s ease-out infinite;
    }

    @keyframes pulseWave {
        0% {
            transform: scale(0.8);
            opacity: 0.8;
        }
        100% {
            transform: scale(2.4);
            opacity: 0;
        }
    }

    /* Gradient Shimmer Text */
    .status-text {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        background: linear-gradient(
            90deg, 
            #ffffff 0%, 
            #ff893d 25%, 
            #ff2a85 50%, 
            #3296fa 75%, 
            #ffffff 100%
        );
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: textShimmer 4s linear infinite;
    }

    @keyframes textShimmer {
        0% { background-position: 200% center; }
        100% { background-position: 0% center; }
    }
</style>
</head>
<body>
    <div class="widget-container siri-gradient">
        <div class="widget-inner">
            <!-- Polished Status Pill -->
            <div class="status-badge">
                <span class="status-dot"></span>
                <span class="status-text" id="status">Listening</span>
            </div>

            <div class="black-hole-container">
                <svg viewBox="0 0 240 240" width="100%" height="100%">
                    <defs>
                        <mask id="blackHoleMask">
                            <g transform="rotate(15 120 120)">
                                <!-- Back Rings -->
                                <g>
                                    <ellipse cx="120" cy="120" rx="90" ry="25" stroke="rgba(255,255,255,0.4)" stroke-width="12" fill="none" filter="blur(6px)" />
                                    <ellipse cx="120" cy="120" rx="90" ry="25" stroke="rgba(255,255,255,0.7)" stroke-width="2" fill="none" />
                                    <ellipse cx="120" cy="120" rx="90" ry="25" stroke="white" stroke-width="6" fill="none" class="shine-back" filter="blur(1px)" />
                                </g>
                                
                                <!-- Event Horizon -->
                                <circle cx="120" cy="120" r="42" fill="black" />
                                <circle cx="120" cy="120" r="42" stroke="white" stroke-width="5" fill="none" filter="blur(3px)" />
                                <circle cx="120" cy="120" r="42" stroke="white" stroke-width="1.5" fill="none" />
                                <circle cx="120" cy="120" r="42" stroke="white" stroke-width="4" fill="none" class="shine-horizon" filter="blur(1px)" />
                                
                                <!-- Front Rings -->
                                <g>
                                    <path d="M 30,120 A 90,25 0 0,0 210,120" stroke="rgba(255,255,255,0.6)" stroke-width="14" fill="none" filter="blur(4px)" />
                                    <path d="M 30,120 A 90,25 0 0,0 210,120" stroke="rgba(255,255,255,0.9)" stroke-width="2" fill="none" />
                                    <path d="M 45,120 A 75,15 0 0,0 195,120" stroke="rgba(255,255,255,0.8)" stroke-width="1.5" fill="none" />
                                    <path d="M 30,120 A 90,25 0 0,0 210,120" stroke="white" stroke-width="6" fill="none" class="shine-front" filter="blur(1px)"/>
                                </g>
                            </g>
                        </mask>
                    </defs>
                    
                    <foreignObject width="240" height="240" mask="url(#blackHoleMask)">
                        <div xmlns="http://www.w3.org/1999/xhtml" class="siri-gradient" style="width: 100%; height: 100%;"></div>
                    </foreignObject>
                </svg>
            </div>
        </div>
    </div>
</body>
</html>
