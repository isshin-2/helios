<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
    body, html {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background-color: transparent; overflow: hidden;
    }
    #siri-overlay {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        border-radius: 40px; /* Squircle */
        opacity: 1;
        -webkit-mask-image: 
            linear-gradient(to bottom, 
                rgba(0,0,0,1) 0%, rgba(0,0,0,0.8) 15px, rgba(0,0,0,0) 80px, 
                rgba(0,0,0,0) calc(100% - 80px), rgba(0,0,0,0.8) calc(100% - 15px), rgba(0,0,0,1) 100%),
            linear-gradient(to right, 
                rgba(0,0,0,1) 0%, rgba(0,0,0,0.8) 15px, rgba(0,0,0,0) 80px, 
                rgba(0,0,0,0) calc(100% - 80px), rgba(0,0,0,0.8) calc(100% - 15px), rgba(0,0,0,1) 100%);
        mask-image: 
            linear-gradient(to bottom, 
                rgba(0,0,0,1) 0%, rgba(0,0,0,0.8) 15px, rgba(0,0,0,0) 80px, 
                rgba(0,0,0,0) calc(100% - 80px), rgba(0,0,0,0.8) calc(100% - 15px), rgba(0,0,0,1) 100%),
            linear-gradient(to right, 
                rgba(0,0,0,1) 0%, rgba(0,0,0,0.8) 15px, rgba(0,0,0,0) 80px, 
                rgba(0,0,0,0) calc(100% - 80px), rgba(0,0,0,0.8) calc(100% - 15px), rgba(0,0,0,1) 100%);
    }
    .siri-gradient {
        position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
        background: conic-gradient(from 0deg, #ff2a85, #8a2be2, #00d2ff, #ff8c00, #ff2a85);
        filter: blur(20px); animation: rotateGradient 4s linear infinite;
    }
    @keyframes rotateGradient {
        0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); }
    }
    
    /* HELIOS Animated Logo CSS */
    .helios-logo-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
    }
    
    .helios-ring {
        transform-origin: center;
        animation: spinRing 10s linear infinite;
    }
    
    .helios-core {
        animation: pulseCore 2s ease-in-out infinite alternate;
    }
    
    .helios-text {
        margin-top: 15px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 5px;
        background: linear-gradient(90deg, #ff2a85, #8a2be2, #00d2ff);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: gradientShift 4s linear infinite;
    }
    
    @keyframes spinRing {
        100% { transform: rotate(360deg); }
    }
    
    @keyframes pulseCore {
        0% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(255,255,255,0.5)); }
        100% { transform: scale(1.15); filter: drop-shadow(0 0 15px rgba(255,255,255,0.9)); }
    }
    
    @keyframes gradientShift {
        0% { background-position: 0% center; }
        100% { background-position: 200% center; }
    }
</style>
</head>
<body style="background-color: #1a1a1a; border-radius: 40px;">
    <!-- The glowing border overlay with the transparent mask -->
    <div id="siri-overlay">
        <div class="siri-gradient"></div>
    </div>
    
    <!-- Animated HELIOS Logo (Outside the mask so it's visible!) -->
    <div class="helios-logo-container">
        <svg viewBox="0 0 100 100" width="70" height="70">
            <!-- Outer rotating dashed ring -->
            <circle cx="50" cy="50" r="42" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-dasharray="10 8" fill="none" class="helios-ring" />
            <!-- Inner solid ring -->
            <circle cx="50" cy="50" r="32" stroke="rgba(255,255,255,0.2)" stroke-width="1" fill="none" />
            <!-- Pulsing core / sun -->
            <circle cx="50" cy="50" r="16" fill="white" class="helios-core" />
        </svg>
        <div class="helios-text">HELIOS</div>
    </div>
</body>
</html>
