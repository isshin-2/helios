<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
    body, html {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background-color: transparent !important; 
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    
    .black-hole-container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        animation: float 6s ease-in-out infinite alternate;
    }
    
    /* Glowing animations */
    .glow-ring {
        animation: pulseGlow 3s ease-in-out infinite alternate;
    }
    
    .core-ring {
        animation: pulseCore 2s ease-in-out infinite alternate;
    }
    
    .event-horizon {
        animation: horizonPulse 4s ease-in-out infinite alternate;
    }

    @keyframes float {
        0% { transform: translateY(-5px) rotate(0deg); }
        100% { transform: translateY(5px) rotate(2deg); }
    }
    
    @keyframes pulseGlow {
        0% { filter: blur(3px) brightness(1); stroke-width: 10px; }
        100% { filter: blur(6px) brightness(1.5); stroke-width: 14px; }
    }
    
    @keyframes pulseCore {
        0% { filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.8)); opacity: 0.8; }
        100% { filter: drop-shadow(0 0 15px rgba(100, 200, 255, 1)); opacity: 1; }
    }
    
    @keyframes horizonPulse {
        0% { stroke: rgba(0, 150, 255, 0.4); stroke-width: 4px; }
        100% { stroke: rgba(100, 220, 255, 0.8); stroke-width: 8px; }
    }
</style>
</head>
<body>
    <div class="black-hole-container">
        <svg viewBox="0 0 240 240" width="240" height="240">
            <g transform="rotate(15 120 120)">
                <!-- Back Accretion Disk (Behind Black Hole) -->
                <path d="M 20,120 A 100,30 0 0,1 220,120" stroke="rgba(0, 100, 255, 0.4)" stroke-width="8" fill="none" filter="blur(3px)" />
                <path d="M 20,120 A 100,30 0 0,1 220,120" stroke="rgba(150, 220, 255, 0.6)" stroke-width="2" fill="none" />
                
                <!-- The Black Hole (Event Horizon) -->
                <!-- Dark shadow behind to give depth -->
                <circle cx="120" cy="120" r="45" fill="rgba(0, 20, 40, 0.5)" filter="blur(10px)" />
                <!-- Black core -->
                <circle cx="120" cy="120" r="42" fill="#020205" />
                <!-- Glowing event horizon edge -->
                <circle cx="120" cy="120" r="42" stroke="rgba(0, 150, 255, 0.5)" stroke-width="4" fill="none" class="event-horizon" filter="blur(2px)" />
                <circle cx="120" cy="120" r="42" stroke="rgba(200, 240, 255, 0.8)" stroke-width="1.5" fill="none" />
                
                <!-- Front Accretion Disk (In front of Black Hole) -->
                <!-- Outer blue glow -->
                <path d="M 20,120 A 100,30 0 0,0 220,120" stroke="rgba(0, 150, 255, 0.7)" stroke-width="12" fill="none" class="glow-ring" />
                <!-- Bright core ring -->
                <path d="M 20,120 A 100,30 0 0,0 220,120" stroke="rgba(255, 255, 255, 0.95)" stroke-width="3" fill="none" class="core-ring" />
                
                <!-- Inner secondary ring (front only) -->
                <path d="M 40,120 A 80,20 0 0,0 200,120" stroke="rgba(50, 200, 255, 0.8)" stroke-width="2" fill="none" filter="blur(1px)" />
            </g>
        </svg>
    </div>
</body>
</html>
