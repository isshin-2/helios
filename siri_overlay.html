<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
    body, html {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background-color: transparent !important; 
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    
    @property --angle {
        syntax: '<angle>';
        initial-value: 0deg;
        inherits: false;
    }
    
    .siri-gradient {
        width: 100%;
        height: 100%;
        background: conic-gradient(
            from var(--angle), 
            #ea4326, #ff893d, #ea4326, #3296fa, #2a5298, #ff2a85, #ea4326
        );
        animation: rotateGradient 4s linear infinite;
    }
    
    @keyframes rotateGradient {
        0% { --angle: 0deg; }
        100% { --angle: 360deg; }
    }

    .black-hole-container {
        position: relative;
        width: 240px;
        height: 240px;
        animation: float 6s ease-in-out infinite alternate;
    }
    
    /* Ring Animations */
    .ring-back {
        transform-origin: 120px 120px;
        animation: spinRingBack 15s linear infinite;
    }
    .ring-front {
        transform-origin: 120px 120px;
        animation: spinRingFront 12s linear infinite;
    }
    
    @keyframes spinRingBack {
        0% { transform: rotate(15deg); }
        100% { transform: rotate(375deg); }
    }
    @keyframes spinRingFront {
        0% { transform: rotate(15deg); }
        100% { transform: rotate(375deg); }
    }
    
    @keyframes float {
        0% { transform: translateY(-5px); }
        100% { transform: translateY(5px); }
    }
    
    .glow-pulse {
        animation: pulseGlow 3s ease-in-out infinite alternate;
    }
    
    @keyframes pulseGlow {
        0% { filter: blur(4px); stroke-width: 8px; }
        100% { filter: blur(8px); stroke-width: 14px; }
    }
</style>
</head>
<body>
    <div class="black-hole-container">
        <!-- SVG Masking the CSS Conic Gradient -->
        <svg viewBox="0 0 240 240" width="100%" height="100%">
            <defs>
                <mask id="blackHoleMask">
                    <!-- Everything white is visible, black is hidden -->
                    
                    <!-- Back Accretion Disk Rings -->
                    <g class="ring-back">
                        <!-- Outer blur ring -->
                        <ellipse cx="120" cy="120" rx="90" ry="25" stroke="rgba(255,255,255,0.7)" stroke-width="10" fill="none" filter="blur(6px)" />
                        <!-- Inner sharp ring -->
                        <ellipse cx="120" cy="120" rx="90" ry="25" stroke="white" stroke-width="2" fill="none" />
                        <ellipse cx="120" cy="120" rx="75" ry="15" stroke="rgba(255,255,255,0.9)" stroke-width="3" fill="none" />
                    </g>
                    
                    <!-- The Black Hole (Event Horizon) -->
                    <!-- This hides the back rings! -->
                    <circle cx="120" cy="120" r="42" fill="black" />
                    
                    <!-- Event Horizon Edge Glow -->
                    <circle cx="120" cy="120" r="42" stroke="white" stroke-width="3" fill="none" filter="blur(2px)" />
                    <circle cx="120" cy="120" r="42" stroke="white" stroke-width="1" fill="none" />
                    
                    <!-- Front Accretion Disk Rings (Only drawing the bottom half so it overlays the black hole) -->
                    <g class="ring-front">
                        <path d="M 30,120 A 90,25 0 0,0 210,120" stroke="rgba(255,255,255,0.8)" stroke-width="12" fill="none" class="glow-pulse" />
                        <path d="M 30,120 A 90,25 0 0,0 210,120" stroke="white" stroke-width="3" fill="none" />
                        <path d="M 45,120 A 75,15 0 0,0 195,120" stroke="rgba(255,255,255,0.9)" stroke-width="2" fill="none" />
                    </g>
                </mask>
            </defs>
            
            <!-- This foreignObject holds the CSS gradient and is masked by the SVG! -->
            <foreignObject width="240" height="240" mask="url(#blackHoleMask)">
                <div xmlns="http://www.w3.org/1999/xhtml" class="siri-gradient"></div>
            </foreignObject>
        </svg>
    </div>
</body>
</html>
