<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIKO — Autonomous 3D VRM AI Companion</title>
    <link rel="stylesheet" href="style.css">
    <!-- Import map for Three.js and @pixiv/three-vrm -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
            "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.3.4/lib/three-vrm.module.js"
        }
    }
    </script>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- Status message overlay -->
    <div id="status-badge">
        Loading 3D VRM model...
    </div>

    <!-- Riko Internal Thought HUD -->
    <div id="thought-banner" style="display: none;">
        <span class="thought-label">💭 Riko's Thought:</span>
        <span id="thought-text"></span>
    </div>

    <!-- Top control bar with Import buttons, AI States, Navigation, Poses & Presets -->
    <div id="top-ui">
        <div id="test-controls">
            <label class="btn-import">
                📁 Import VRM (.vrm)
                <input type="file" id="vrm-file-input" accept=".vrm,.glb">
            </label>
            <label class="btn-import btn-import-anim">
                🎞️ Import Mixamo (.fbx)
                <input type="file" id="fbx-file-input" accept=".fbx">
            </label>
            <button id="btn-idle">Idle</button>
            <button id="btn-listening">Listening</button>
            <button id="btn-thinking">Thinking</button>
            <button id="btn-speaking">Speaking</button>
            <button id="btn-reset-cam">Reset View</button>
        </div>

        <!-- Spatial Navigation ("Come to Me" Mechanics) -->
        <div id="nav-controls">
            <span class="preset-label">Spatial Navigation:</span>
            <div id="nav-buttons">
                <button data-nav="walk_to_user">🚶‍♀️ Walk to Me (0.85m)</button>
                <button data-nav="step_back">↩️ Step Back</button>
                <button data-nav="circle_user">🔄 Circle Me</button>
                <button data-nav="return_center">🎯 Return Center</button>
                <button data-nav="stay" class="active">🛑 Stay</button>
            </div>
        </div>

        <!-- Neural Voice Selector & HELIOS Add-On Bridge Controls -->
        <div id="voice-controls">
            <span class="preset-label">🎙️ Riko Voice:</span>
            <select id="voice-select" title="Choose Riko's Neural TTS Voice">
                <option value="af_heart" selected>💖 Riko (Warm & Expressive)</option>
                <option value="af_bella">🌸 Bella (Bright Anime Girl)</option>
                <option value="af_sky">⚡ Sky (Energetic & Cheerful)</option>
                <option value="af_nicole">😏 Nicole (Sassy Tsundere)</option>
                <option value="af_nova">✨ Nova (Playful & Witty)</option>
                <option value="af_sarah">🎵 Sarah (Clear & Natural)</option>
                <option value="bf_emma">👑 Emma (British Tsundere)</option>
                <option value="bf_lily">🎀 Lily (Sweet British)</option>
                <option value="jf_alpha">🇯🇵 Alpha (Japanese Accent)</option>
            </select>
            <button id="btn-test-voice">🔊 Speak Line</button>
            <button id="btn-mute-voice" class="active">🔊 Voice: ON</button>

            <span class="addon-divider">|</span>
            <span class="preset-label">🔌 HELIOS Add-On:</span>
            <span id="helios-status-pill" class="addon-pill offline" title="Separate Add-On Bridge to HELIOS Core (http://localhost:8000)">🟡 Standalone (:8000 Offline)</span>
            <select id="brain-mode-select" title="Choose whether Riko routes through HELIOS Core (:8000) or runs Standalone">
                <option value="auto" selected>🔗 Auto (HELIOS Core + Fallback)</option>
                <option value="helios">🧠 HELIOS Core (:8000)</option>
                <option value="standalone">⚡ Standalone Riko Only</option>
            </select>
            <button id="btn-mirror-helios" class="active" title="Mirror live HELIOS Core listening/thinking/speaking events onto 3D Riko">🔄 Mirror: ON</button>
        </div>

        <!-- 3D Body, Hand & Full-Body Animations Bar (Controlled by Riko AI or Manual Click) -->
        <div id="pose-controls">
            <span class="preset-label">Riko Emotes & IK Poses:</span>
            <div id="pose-buttons">
                <button data-pose="idle" class="active">🧍 Idle</button>
                <button data-pose="listen_pose">👂 Listening</button>
                <button data-pose="talk_explain">🗣️ Talk (Explain)</button>
                <button data-pose="talk_excited">✨ Talk (Happy)</button>
                <button data-pose="talk_smug">😏 Talk (Smug)</button>
                <button data-pose="talk_angry">💢 Talk (Angry)</button>
                <button data-pose="talk_sad">🥺 Talk (Sad)</button>
                <button data-pose="talk_surprised">😲 Talk (Surprised)</button>
                <button data-pose="walk">🚶 Walk</button>
                <button data-pose="wave">👋 Wave</button>
                <button data-pose="think_pose">🤔 Think (Chin)</button>
                <button data-pose="smug_pose">😤 Smug Crossed</button>
                <button data-pose="backflip">🤸 Backflip</button>
                <button data-pose="dance_shikano">🦌 Shikano Dance</button>
                <button data-pose="hug_attempt">🤗 Hug</button>
                <button data-pose="refuse">🙅‍♀️ Refuse</button>
                <button data-pose="peace">✌️ Peace</button>
                <button data-pose="cheer">🙌 Cheer</button>
                <button data-pose="shrug">🤷 Shrug</button>
                <button data-pose="bow">🙇 Bow</button>
                <button data-pose="nod">👍 Nod</button>
                <button data-pose="confident">😎 Confident</button>
                <button data-pose="shy">👉👈 Shy</button>
            </div>
        </div>

        <!-- Dynamically populated from VRM model preset expressions -->
        <div id="preset-controls" style="display: none;">
            <span class="preset-label">BlendShapes:</span>
            <div id="preset-buttons"></div>
        </div>
    </div>

    <!-- Local AI Chat & Voice Input UI -->
    <div id="chat-container">
        <div id="chat-log"></div>
        <div id="chat-input-wrapper">
            <button id="chat-mic" title="Hold or click to talk via microphone">🎤</button>
            <input type="text" id="chat-input" placeholder="Talk to Riko! Ask her to come closer, do a backflip, dance, wave, think, peace sign..." autocomplete="off">
            <button id="chat-send">Send</button>
        </div>
    </div>

    <script type="module" src="app.js?v=6"></script>
</body>
</html>
