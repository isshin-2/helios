<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: transparent;
      width: 100vw;
      height: 80px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Consolas, monospace;
    }

    /* Compact Cybernetic HUD Warning Pill */
    .helios-banner {
      width: 580px;
      height: 52px;
      background: rgba(12, 10, 16, 0.94);
      border: 2px solid #ff3b30;
      border-radius: 26px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 0 20px rgba(255, 59, 48, 0.6), inset 0 0 10px rgba(255, 59, 48, 0.25);
      animation: alertPulse 1.5s ease-in-out infinite alternate;
      overflow: hidden;
    }

    /* Cyber scanline overlay */
    .scanlines {
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 1;
    }

    .badge-section {
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 2;
    }

    .tag {
      background: #ff3b30;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      padding: 3px 8px;
      border-radius: 12px;
      text-transform: uppercase;
    }

    .alert-text {
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 2;
    }

    .highlight {
      color: #ffd60a;
      text-shadow: 0 0 8px rgba(255, 214, 10, 0.6);
      font-weight: 800;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 2;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background: #ff3b30;
      border-radius: 50%;
      box-shadow: 0 0 10px #ff3b30;
      animation: blink 0.7s infinite alternate ease-in-out;
    }

    .lock-label {
      color: #ff453a;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    @keyframes alertPulse {
      0% {
        border-color: #ff3b30;
        box-shadow: 0 0 12px rgba(255, 59, 48, 0.4), inset 0 0 6px rgba(255, 59, 48, 0.2);
      }
      100% {
        border-color: #ff6961;
        box-shadow: 0 0 24px rgba(255, 59, 48, 0.8), inset 0 0 12px rgba(255, 59, 48, 0.4);
      }
    }

    @keyframes blink {
      0% { opacity: 0.3; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1.15); }
    }
  </style>
</head>
<body>
  <div class="helios-banner">
    <div class="scanlines"></div>

    <div class="badge-section">
      <span class="tag">HELIOS VLA</span>
    </div>

    <div class="alert-text">
      ✋ <span class="highlight">HANDS OFF KEYBOARD & MOUSE</span> — AI Control Active
    </div>

    <div class="status-indicator">
      <div class="pulse-dot"></div>
      <span class="lock-label">AUTONOMOUS</span>
    </div>
  </div>
</body>
</html>
